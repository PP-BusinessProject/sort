publish_to: none

name: sort
version: 1.0.0+1
environment:
  sdk: '>=2.18.0 <3.0.0'
  flutter: '>=3.3.0 <4.0.0'

dependencies:
  animate_do: ^2.1.0
  auto_size_text: ^3.0.0
  cached_network_image: ^3.2.2
  card_swiper: ^2.0.4
  catcher: ^0.6.9
  clipboard: ^0.1.3
  collection: ^1.16.0
  control_style: ^0.0.3
  cupertino_icons: ^1.0.5
  dio: ^4.0.6
  dismissible_page: ^0.7.3
  easy_refresh: ^3.0.4+2
  email_validator: ^2.1.17
  expand_tap_area: ^1.1.1
  flutter:
    sdk: flutter
  flutter_hooks: ^0.18.5+1
  flutter_inner_drawer:
    git:
      url: https://github.com/NO-ob/flutter_inner_drawer
  flutter_localizations:
    sdk: flutter
  flutter_map: ^3.0.0
  flutter_map_marker_cluster: ^0.5.4
  flutter_riverpod: ^2.0.0-dev.9
  flutter_secure_storage: ^6.0.0
  geocoding: ^2.0.5
  geolocator: ^9.0.1
  google_static_maps_controller: ^1.0.0
  group_radio_button: ^1.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hooks_riverpod: ^2.0.0-dev.9
  intl: ^0.17.0
  json_converters_lite: ^1.0.2+1
  latlong2: ^0.8.1
  logger: ^1.1.0
  logging: ^1.0.2
  marquee: ^2.2.3
  meta: ^1.8.0
  ndialog: ^4.1.1+1
  package_info_plus: ^1.4.2
  page_transition: ^2.0.9
  path_provider: ^2.0.11
  phone_form_field: ^7.0.2
  pin_code_fields: ^7.4.0
  riverpod: ^2.0.0-dev.9
  shimmer_animation: ^2.1.0+1
  snapping_sheet: ^3.1.0
  splash: ^1.1.0
  supabase_flutter: ^1.0.0-dev.8
  syncfusion_flutter_barcodes: ^20.2.50
  syncfusion_flutter_charts: ^20.2.50
  syncfusion_flutter_core: ^20.2.50
  syncfusion_flutter_datepicker: ^20.2.50
  syncfusion_flutter_sliders: ^20.2.50
  url_launcher: ^6.1.5
  vector_math: ^2.1.2
  webview_flutter: ^3.0.4

dev_dependencies:
  build_runner: ^2.2.1
  flutter_test:
    sdk: flutter
  generators:
    path: ../generators

dependency_overrides:
  flutter_map: ^3.0.0
  meta: ^1.8.0

flutter:
  assets:
    - source/assets/
    - source/assets/countries/

  fonts:
    - family: Icons
      fonts:
        - asset: source/icons.ttf

    # Use only for Android
    - family: .SF Pro Text
      fonts:
        - asset: source/fonts/SF-Pro-Text-Regular.otf
          weight: 400
        - asset: source/fonts/SF-Pro-Text-Medium.otf
          weight: 500
        - asset: source/fonts/SF-Pro-Text-Bold.otf
          weight: 700

flavorizr:
  ide: vscode
  app:
    android:
      flavorDimensions: app
    ios:
      buildSettings: {}

  flavors:
    b2c:
      app:
        name: SORT
        icon: source/launcher_icons/b2c.png
      android:
        applicationId: com.business_project.sort.b2c
        generateDummyAssets: false
      ios:
        bundleId: com.business-project.sort.b2c
        generateDummyAssets: false

    b2b:
      app:
        name: SORT Business
        icon: source/launcher_icons/b2b.png
      android:
        applicationId: com.business_project.sort.b2b
        generateDummyAssets: false
      ios:
        bundleId: com.business-project.sort.b2b
        generateDummyAssets: false

    delivery:
      app:
        name: SORT Delivery
        icon: source/launcher_icons/delivery.png
      android:
        applicationId: com.business_project.sort.delivery
        generateDummyAssets: false
      ios:
        bundleId: com.business-project.sort.b2b
        generateDummyAssets: false

    support:
      app:
        name: SORT Support
        icon: source/launcher_icons/support.png
      android:
        applicationId: com.business_project.sort
        generateDummyAssets: false
      ios:
        bundleId: com.business-project.sort
        generateDummyAssets: false